server {
    listen 80;
    server_name localhost erp.marina-worldlink.com;

    # Next.js Frontend
    location / {
        proxy_pass http://erp-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ERPNext Backend API
    location /api/ {
        proxy_pass http://192.168.139.48/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ERPNext Backend Resources
    location /assets/ {
        proxy_pass http://erp-backend-web:8000/assets/;
        proxy_set_header Host $host;
    }
}

